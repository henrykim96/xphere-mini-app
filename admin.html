<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xphere Admin Dashboard</title>
  <style>
    /* ===== Xphere 다크 테마 (내부 대시보드) ===== */
    :root {
      --bg: #0a0507; --card: rgba(30,18,22,0.55); --line: rgba(225,29,42,0.18);
      --line2: rgba(255,255,255,0.06); --text: #f5eef0; --muted: #9a8a8e; --red: #e11d2a; --red-hi: #ff3547; --green: #2ecc71;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(120% 60% at 80% -5%, rgba(225,29,42,0.22), transparent 55%), linear-gradient(180deg, #0f0a0c, var(--bg));
      background-attachment: fixed; min-height: 100vh; padding: 24px 16px 60px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    /* 로그인 */
    .gate { max-width: 360px; margin: 60px auto; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px; text-align: center; backdrop-filter: blur(8px); }
    .gate h2 { margin: 0 0 6px; }
    .gate p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    .gate input { width: 100%; padding: 13px 14px; border-radius: 10px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--line2); color: var(--text); font-size: 15px; margin-bottom: 12px; }
    .gate input:focus { outline: none; border-color: var(--red); }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px;
      background: linear-gradient(90deg, var(--red), #8f0f1a); color: #fff; }
    .err { color: var(--red-hi); font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* 통계 카드 */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; padding: 16px; }
    .stat .n { font-size: 26px; font-weight: 800; }
    .stat .l { color: var(--muted); font-size: 12px; margin-top: 4px; }

    /* 표 */
    .tablewrap { background: var(--card); border: 1px solid var(--line2); border-radius: 14px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line2); }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: #14100f; }
    tr:last-child td { border-bottom: none; }
    tbody tr.user { cursor: pointer; }
    tbody tr.user:hover { background: rgba(255,255,255,0.03); }
    .rank { font-weight: 800; color: var(--red-hi); }
    .wallet { font-family: monospace; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
    .toolbar .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .toolbar input[type=text] { padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--line2); color: var(--text); font-size: 13px; min-width: 240px; }
    .toolbar input[type=text]:focus { outline: none; border-color: var(--red); }
    .toolbar label { color: var(--text); font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .toolbar button, .more { background: rgba(255,255,255,0.06); border: 1px solid var(--line2); color: var(--text);
      border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
    .toolbar button:disabled { opacity: .5; cursor: default; }
    .hidden { display: none; }
    .loaded { color: var(--muted); font-size: 12px; }

    /* 행을 눌렀을 때 펼쳐지는 포인트 내역 */
    td.detail { background: rgba(0,0,0,0.25); white-space: normal; padding: 12px 18px 16px; }
    .log-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line2); font-size: 13px; }
    .log-row:last-child { border-bottom: none; }
    .log-row small { color: var(--muted); }
    .log-pts { color: var(--green); font-weight: 700; }
    .log-empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 로그인 화면 -->
    <div class="gate" id="gate">
      <h2>🔒 Admin Dashboard</h2>
      <p>Enter the team password to view stats.</p>
      <input type="password" id="pw" placeholder="Password" />
      <button class="btn" id="loginBtn">View Dashboard</button>
      <div class="err" id="err"></div>
    </div>

    <!-- 대시보드 -->
    <div id="dash" class="hidden">
      <h1>Xphere Admin Dashboard</h1>
      <div class="sub">Internal only — points ranking &amp; user data. Click a row to see that user's point history.</div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="left">
          <input type="text" id="search" placeholder="Search name / X / wallet / Telegram ID" />
          <label><input type="checkbox" id="walletOnly" /> Wallet registered only</label>
          <div style="color:var(--muted);font-size:13px" id="count"></div>
        </div>
        <div>
          <span class="loaded" id="loadedAt"></span>
          <button id="refreshBtn">Refresh</button>
          <button id="csvBtn">Download CSV</button>
        </div>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>#</th><th>Reg #</th><th>Name</th><th>Points</th><th>Referrals</th><th>Onboarded</th><th>X</th><th>Repost</th><th>Wallet</th><th>Registered</th><th>Joined</th><th>Telegram ID</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div style="text-align:center;margin-top:14px"><button class="more hidden" id="moreBtn">Show more</button></div>
    </div>

  </div>

  <script>
    // 백엔드 함수 주소 + 공개키 (게이트 통과용, 실제 데이터는 서버가 비번 확인 후 줌)
    const FUNCTION_URL = "https://ltodfynoaozgcaobwcgo.supabase.co/functions/v1/dynamic-handler";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0b2RmeW5vYW96Z2Nhb2J3Y2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5OTUyNDYsImV4cCI6MjA5OTU3MTI0Nn0.Fz5b50r2OIhkg7quvndelfFwjq2tvWnVtAuweHdRsBA";

    const SHOW_STEP = 200;   // 표에는 처음 이만큼만 그리고, Show more 를 누를 때마다 이만큼씩 더 그림 (수만 명을 한꺼번에 그리면 브라우저가 느려짐)
    let USERS = [];   // 서버가 준 전체 유저 (포인트 순). 각 유저에 rank(전체 순위)·wrank(지갑 등록자 중 순위) 를 붙임
    let VIEW = [];    // 지금 필터·검색이 적용된 전체 결과 (CSV 는 이걸 그대로 내보냄)
    let SHOWN = SHOW_STEP;   // 지금 표에 그려진 줄 수
    let PW = "";      // 로그인에 쓴 비밀번호 (유저별 내역 조회에 다시 사용, 이 탭 메모리에만 있음)

    function callAdmin(body) {
      return fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON, "apikey": SUPABASE_ANON },
        body: JSON.stringify(Object.assign({ password: PW }, body)),
      }).then(function (r) { return r.json(); });
    }

    // 서버에서 전체 유저를 받아 순위를 붙임. force=true 면 서버가 보관해 둔(60초) 결과를 무시하고 새로 읽음
    async function loadUsers(force) {
      const out = await callAdmin({ action: "admin_leaderboard", force: !!force });
      if (!out.ok) return out;
      USERS = out.users || [];
      // ★ 순위: 서버가 '포인트 높은 순 → 먼저 가입한 순 → 텔레그램 ID 작은 순'으로 이미 정렬해서 줌
      //   rank = 전체 순위, wrank = 지갑을 등록한 유저들 사이의 순위 (에어드랍 지급 대상 순위)
      let w = 0;
      USERS.forEach(function (u, i) {
        u.rank = i + 1; u.wrank = u.wallet ? ++w : "";
        u._s = [u.name, u.x_handle, u.wallet, u.telegram_id].map(function (v) { return v == null ? "" : String(v); }).join(" ").toLowerCase();   // 검색용 (미리 만들어 둠)
      });
      document.getElementById("loadedAt").textContent = "Loaded " + new Date(out.at || Date.now()).toLocaleTimeString() + (out.cached ? " (cached)" : "");
      return out;
    }

    async function login() {
      const err = document.getElementById("err");
      err.textContent = "";
      PW = document.getElementById("pw").value;
      try {
        const out = await loadUsers(false);
        if (!out.ok) { err.textContent = "Wrong password."; return; }
        showDashboard();
      } catch (e) { err.textContent = "Network error."; }
    }

    async function refresh() {
      const btn = document.getElementById("refreshBtn");
      btn.disabled = true; btn.textContent = "Loading...";
      try { const out = await loadUsers(true); if (out.ok) showDashboard(); } catch (e) {}
      btn.disabled = false; btn.textContent = "Refresh";
    }

    function showDashboard() {
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("dash").classList.remove("hidden");

      // 통계 (항상 전체 기준)
      const total = USERS.length;
      const withWallet = USERS.filter(function (u) { return u.wallet; }).length;
      const totalPoints = USERS.reduce(function (s, u) { return s + (u.points || 0); }, 0);
      const onboarded = USERS.filter(function (u) { return u.onboarded; }).length;
      document.getElementById("stats").innerHTML =
        stat(total, "Total Users") + stat(onboarded, "Onboarded") +
        stat(withWallet, "Wallets Registered") + stat(totalPoints, "Total Points");
      render();
    }

    // 필터·검색을 적용하고 표를 다시 그림. keep=true 면 지금 보이는 줄 수를 유지(Show more 용)
    function render(keep) {
      if (!keep) SHOWN = SHOW_STEP;
      const q = document.getElementById("search").value.trim().toLowerCase();
      const only = document.getElementById("walletOnly").checked;
      VIEW = USERS.filter(function (u) {
        if (only && !u.wallet) return false;
        return !q || u._s.indexOf(q) !== -1;
      });
      const shown = Math.min(SHOWN, VIEW.length);
      document.getElementById("count").textContent = "Showing " + shown.toLocaleString() + " of " + VIEW.length.toLocaleString() +
        " (total " + USERS.length.toLocaleString() + " users, sorted by points)";
      document.getElementById("moreBtn").classList.toggle("hidden", shown >= VIEW.length);

      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      const frag = document.createDocumentFragment();
      VIEW.slice(0, shown).forEach(function (u) {
        const tr = document.createElement("tr");
        tr.className = "user";
        const cells = [
          [u.rank, "rank"], [u.wrank, "rank"], [u.name], [u.points || 0], [u.referrals || 0], [u.onboarded ? "✓" : ""],
          [u.x_handle], [u.x_repost_status === "verified" ? "✓" : (u.x_repost_status === "skipped" ? "skipped" : "")],
          [u.wallet, "wallet"], [u.registered_at ? u.registered_at.slice(0, 10) : ""], [u.created_at ? u.created_at.slice(0, 10) : ""], [u.telegram_id],
        ];
        cells.forEach(function (c) {
          const td = document.createElement("td");
          if (c[1]) td.className = c[1];
          td.textContent = c[0] == null ? "" : String(c[0]);   // textContent = 이름에 HTML이 있어도 안전
          tr.appendChild(td);
        });
        tr.addEventListener("click", function () { toggleDetail(tr, u); });
        frag.appendChild(tr);
      });
      tbody.appendChild(frag);
    }

    // 행을 누르면 그 유저의 포인트 내역(최근 200건)을 아래에 펼침. 다시 누르면 접힘
    async function toggleDetail(tr, u) {
      const next = tr.nextSibling;
      if (next && next.classList && next.classList.contains("detail-row")) { next.remove(); return; }
      const dr = document.createElement("tr"); dr.className = "detail-row";
      const td = document.createElement("td"); td.className = "detail"; td.colSpan = 12;
      td.innerHTML = '<div class="log-empty">Loading...</div>';
      dr.appendChild(td);
      tr.parentNode.insertBefore(dr, tr.nextSibling);
      let out = null;
      try { out = await callAdmin({ action: "admin_user_log", telegram_id: u.telegram_id }); } catch (e) {}
      td.innerHTML = "";
      if (!out || !out.ok) { td.innerHTML = '<div class="log-empty">Failed to load. (Is the latest server code deployed?)</div>'; return; }
      if (!out.list.length) { td.innerHTML = '<div class="log-empty">No point records yet. (Records start from when the History feature was deployed.)</div>'; return; }
      out.list.forEach(function (r) {
        const row = document.createElement("div"); row.className = "log-row";
        const left = document.createElement("div");
        left.textContent = (r.note || r.kind) + " ";
        const small = document.createElement("small");
        small.textContent = "· " + r.kind + " · " + new Date(r.created_at).toLocaleString();
        left.appendChild(small);
        const pts = document.createElement("div"); pts.className = "log-pts"; pts.textContent = "+" + r.points;
        row.appendChild(left); row.appendChild(pts); td.appendChild(row);
      });
    }

    function stat(n, label) { return "<div class='stat'><div class='n'>" + Number(n).toLocaleString() + "</div><div class='l'>" + label + "</div></div>"; }

    // CSV 내보내기 — 지금 필터·검색이 적용된 '전체 결과' 그대로 (표에 그려진 200줄이 아니라 전부). 에어드랍 대상 뽑기용 (rank=전체 순위, wallet_rank=지갑 등록자 중 순위)
    function csvCell(v) { return JSON.stringify(v == null ? "" : String(v)); }
    function downloadCsv() {
      const head = "rank,wallet_rank,name,points,referrals,x_handle,repost_status,wallet,registered,joined,telegram_id\n";
      const body = VIEW.map(function (u) {
        return [u.rank, u.wrank, csvCell(u.name), u.points || 0, u.referrals || 0,
          csvCell(u.x_handle), u.x_repost_status || "", u.wallet || "", (u.registered_at ? u.registered_at.slice(0, 10) : ""),
          (u.created_at ? u.created_at.slice(0, 10) : ""), u.telegram_id].join(",");
      }).join("\n");
      // 맨 앞 ﻿ = 엑셀에서 한글이 안 깨지게 하는 표시(BOM)
      const blob = new Blob(["﻿" + head + body], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "xphere_leaderboard.csv";
      a.click();
    }

    // 검색은 글자를 칠 때마다 수만 줄을 다시 그리지 않도록 잠깐(250ms) 멈춘 뒤 실행
    let searchTimer = null;
    document.getElementById("search").addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { render(); }, 250);
    });
    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
    document.getElementById("csvBtn").addEventListener("click", downloadCsv);
    document.getElementById("refreshBtn").addEventListener("click", refresh);
    document.getElementById("walletOnly").addEventListener("change", function () { render(); });
    document.getElementById("moreBtn").addEventListener("click", function () { SHOWN += SHOW_STEP; render(true); });
  </script>
</body>
</html>
